<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="icon" type="image/png" href="favicon.png">
    <title>Sanjay Krishnan - Resume</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link rel="preconnect" href="https://cdnjs.cloudflare.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="overrides.css">
    <script src="mobile-nav.js" defer></script>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div>
                <ul class="nav-menu">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="Experience.html">EXPERIENCE</a></li>
                    <li><a href="Projects.html">PROJECTS</a></li>
                    <li><a href="Code.html">CODE</a></li>
                    <br>
                    <li class="active"><a href="Resume.html">RESUME</a></li>
                </ul>

                <div class="social-icons">
                    <a href="https://www.linkedin.com/in/sanjkris/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    <a href="https://github.com/sanjkris-git"><i class="fa-brands fa-github"></i></a>
                    <a href="https://www.instagram.com/_san.who_/" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="mailto:sanjkris@gmail.com"><i class="far fa-envelope"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content main-content-transition">
            
            <div class="resume-header">
                <h1>Resume</h1>
            </div>

            <div class="resume-container">
                <div class="resume-image-wrapper">
                    <img src="Sanjay Krishnan Resume Motorsports Internship.png" alt="Sanjay Krishnan Resume" loading="lazy" decoding="async">
                </div>

                <div class="download-buttons">
                    <a href="Sanjay Krishnan Resume Motorsports Internship.pdf" download class="btn btn-pdf">
                        <i class="fas fa-file-pdf"></i> Download PDF
                    </a>
                    <a href="Sanjay Krishnan Resume Motorsports Internship.png" download class="btn btn-png">
                        <i class="fas fa-image"></i> Download PNG
                    </a>
                </div>
            </div>

        </main>
    </div>

    <section class="link-bar">
        <hr>
        <div>
            <a href="https://www.linkedin.com/in/sanjkris/">LinkedIn</a>
            <a href="https://github.com/sanjkris-git">GitHub</a>
            <a href="https://www.instagram.com/_san.who_/">Instagram</a>
            <a href="mailto:sanjkris@gmail.com">Email</a>
        </div>
    </section>

    <script>
        const mainContent = document.querySelector('.main-content');
        const sidebar = document.querySelector('.sidebar');
        const navLinks = document.querySelectorAll('.nav-menu a');

        /* --- Page Transitions --- */
        function fadeOutPage() {
            mainContent.classList.add('main-content-transition');
            mainContent.classList.remove('active');
        }

        function fadeInPage() {
            setTimeout(() => {
                mainContent.classList.add('active');
            }, 50);
        }

        // Navigation click handler
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                // Ignore links opening in a new tab or links triggering a download
                if (this.getAttribute('target') === '_blank' || this.hasAttribute('download')) return;
                
                if (!this.parentElement.classList.contains('active')) {
                    e.preventDefault();
                    fadeOutPage();
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 300);
                }
            });
        });

        // Initialize fade-in
        window.addEventListener('load', fadeInPage);

        /* --- Scroll Effects --- */
        window.addEventListener('scroll', function() {
            const scrollTop = window.scrollY;
            let fadeDistance = mainContent.offsetHeight - window.innerHeight;
            if (fadeDistance <= 0) fadeDistance = 500; 

            const opacity = Math.max(0, 1 - (scrollTop / fadeDistance));
            sidebar.style.opacity = opacity;
        });
    </script>
</body>
</html>
