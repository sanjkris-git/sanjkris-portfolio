<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sanjay Krishnan - Resume</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@100;300;400&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        /* =========================================
           1. CSS Reset & Base Styles
           ========================================= */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            background-color: #121212;
            color: #dcdcdc;
            font-family: 'Montserrat', sans-serif;
            font-weight: 300;
            min-height: 100vh;
        }

        /* =========================================
           2. Layout Structure
           ========================================= */
        .container {
            width: 100%;
            min-height: 100vh;
        }

        .main-content {
            margin-left: 280px;
            padding: 60px 80px 60px 40px;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        /* Page Transition Styles */
        .main-content-transition {
            opacity: 0;
            transform: translateY(20px);
            transition: opacity 0.5s ease, transform 0.5s ease;
        }

        .main-content-transition.active {
            opacity: 1;
            transform: translateY(0);
        }

        /* =========================================
           3. Sidebar Navigation
           ========================================= */
        .sidebar {
            position: fixed;
            width: 200px;
            padding: 60px 40px;
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            height: 100vh;
            transition: opacity 0.1s ease-out; 
        }

        .nav-menu {
            list-style: none;
            margin-bottom: 40px;
            position: relative;
        }

        .nav-menu li {
            margin-bottom: 15px;
            font-size: 20px;
            letter-spacing: 1px;
            position: relative;
        }

        .nav-menu a {
            color: #888;
            text-decoration: none;
            transition: color 0.3s;
            display: block;
            padding: 5px 0;
            position: relative;
        }

        .nav-menu a:hover,
        .nav-menu .active a {
            color: #fff;
        }

        /* Sliding Underline */
        .nav-menu li::after {
            content: '';
            position: absolute;
            bottom: 0;
            left: 0;
            width: 100%;
            height: 1px;
            background-color: #555;
            transform: scaleX(0);
            transform-origin: left;
            transition: transform 0.3s ease;
        }

        .nav-menu li.active::after {
            transform: scaleX(1);
        }

        .social-icons {
            display: flex;
            flex-direction: column;
            gap: 20px;
            margin-bottom: auto;
        }

        .social-icons a {
            color: #dcdcdc;
            font-size: 20px;
            text-decoration: none;
            transition: color 0.3s;
        }

        .social-icons a:hover {
            color: #fff;
        }

        /* =========================================
           4. Resume Specific Styles
           ========================================= */
        .resume-header {
            margin-bottom: 40px;
            text-align: center;
        }

        .resume-header h1 {
            font-size: 80px;
            font-weight: 100;
            line-height: 1.1;
            letter-spacing: 2px;
            color: #fff;
        }

        .resume-container {
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 40px;
            width: 100%;
            max-width: 900px;
            margin: 0 auto;
        }

        .resume-image-wrapper {
            width: 100%;
            box-shadow: 0 15px 35px rgba(0, 0, 0, 0.5);
            border-radius: 8px;
            overflow: hidden;
            border: 1px solid #333;
        }

        .resume-image-wrapper img {
            width: 100%;
            height: auto;
            display: block;
        }

        .download-buttons {
            display: flex;
            gap: 20px;
            justify-content: center;
            flex-wrap: wrap;
            width: 100%;
        }

        .btn {
            padding: 15px 30px;
            border-radius: 6px;
            text-decoration: none;
            font-weight: 400;
            font-size: 18px;
            transition: all 0.3s ease;
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 12px;
            min-width: 220px;
        }

        .btn-pdf {
            background-color: #fff;
            color: #121212;
            border: 1px solid #fff;
        }

        .btn-pdf:hover {
            background-color: #dcdcdc;
            transform: translateY(-3px);
        }

        .btn-png {
            background-color: transparent;
            color: #dcdcdc;
            border: 1px solid #555;
        }

        .btn-png:hover {
            border-color: #fff;
            color: #fff;
            transform: translateY(-3px);
        }

        /* =========================================
           5. Media Queries
           ========================================= */
        @media (max-width: 768px) {
            .sidebar {
                position: relative;
                width: 100%;
                height: auto;
                padding: 20px;
                flex-direction: row;
                align-items: center;
            }
            .nav-menu {
                display: flex;
                gap: 15px;
                margin-bottom: 0;
            }
            .social-icons { flex-direction: row; }
            .main-content {
                margin-left: 0;
                padding: 20px;
            }
            .resume-header h1 {
                font-size: 50px;
            }
            .download-buttons {
                flex-direction: column;
                align-items: center;
            }
            .btn {
                width: 100%;
                max-width: 300px;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <aside class="sidebar">
            <div>
                <ul class="nav-menu">
                    <li><a href="index.html">HOME</a></li>
                    <li><a href="Experience.html">EXPERIENCE</a></li>
                    <li><a href="Projects.html">PROJECTS</a></li>
                    <li><a href="Code.html">CODE</a></li>
                    <br>
                    <li class="active"><a href="Resume.html" style="font-size: 18px;">RESUME</a></li>
                </ul>

                <div class="social-icons">
                    <a href="https://www.linkedin.com/in/sanjkris/" target="_blank"><i class="fab fa-linkedin-in"></i></a>
                    <a href="https://github.com/sanjkris-git"><i class="fa-brands fa-github"></i></a>
                    <a href="https://www.instagram.com/_san.who_/" target="_blank"><i class="fab fa-instagram"></i></a>
                    <a href="mailto:sanjkris@gmail.com"><i class="far fa-envelope"></i></a>
                </div>
            </div>
        </aside>

        <main class="main-content main-content-transition">
            
            <div class="resume-header">
                <h1>Resume</h1>
            </div>

            <div class="resume-container">
                <div class="resume-image-wrapper">
                    <img src="Sanjay Krishnan Resume.png" alt="Sanjay Krishnan Resume">
                </div>

                <div class="download-buttons">
                    <a href="Sanjay Krishnan Resume.pdf" download class="btn btn-pdf">
                        <i class="fas fa-file-pdf"></i> Download PDF
                    </a>
                    <a href="Sanjay Krishnan Resume.png" download class="btn btn-png">
                        <i class="fas fa-image"></i> Download PNG
                    </a>
                </div>
            </div>

        </main>
    </div>

    <section class="link-bar">
        <hr style="border-color: #333; margin-bottom: 20px; margin-top: 40px;">
        <div style="display: flex; justify-content: center; gap: 40px; padding-bottom: 40px; padding-top:20px">
            <a href="https://www.linkedin.com/in/sanjkris/" style="color: #aaa; text-decoration: none; font-size: 18px;">LinkedIn</a>
            <a href="https://github.com/sanjkris-git" style="color: #aaa; text-decoration: none; font-size: 18px;">GitHub</a>
            <a href="https://www.instagram.com/_san.who_/" style="color: #aaa; text-decoration: none; font-size: 18px;">Instagram</a>
            <a href="mailto:sanjkris@gmail.com" style="color: #aaa; text-decoration: none; font-size: 18px;">Email</a>
        </div>
    </section>

    <script>
        const mainContent = document.querySelector('.main-content');
        const sidebar = document.querySelector('.sidebar');
        const navLinks = document.querySelectorAll('.nav-menu a');

        /* --- Page Transitions --- */
        function fadeOutPage() {
            mainContent.classList.add('main-content-transition');
            mainContent.classList.remove('active');
        }

        function fadeInPage() {
            setTimeout(() => {
                mainContent.classList.add('active');
            }, 50);
        }

        // Navigation click handler
        navLinks.forEach(link => {
            link.addEventListener('click', function(e) {
                // Ignore links opening in a new tab or links triggering a download
                if (this.getAttribute('target') === '_blank' || this.hasAttribute('download')) return;
                
                if (!this.parentElement.classList.contains('active')) {
                    e.preventDefault();
                    fadeOutPage();
                    setTimeout(() => {
                        window.location.href = this.href;
                    }, 300);
                }
            });
        });

        // Initialize fade-in
        window.addEventListener('load', fadeInPage);

        /* --- Scroll Effects --- */
        window.addEventListener('scroll', function() {
            const scrollTop = window.scrollY;
            let fadeDistance = mainContent.offsetHeight - window.innerHeight;
            if (fadeDistance <= 0) fadeDistance = 500; 

            const opacity = Math.max(0, 1 - (scrollTop / fadeDistance));
            sidebar.style.opacity = opacity;
        });
    </script>
</body>
</html>
